name: Operations Analytics CI & Data Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Quality Unit Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v

    - name: Initialize PostgreSQL Schema
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d analytics_db -f sql/V1__schema_init.sql
        psql -h localhost -U postgres -d analytics_db -f sql/V2__kpi_views.sql

    - name: Run Python ETL Pipeline Execution
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: analytics_db
        PYTHONPATH: .
      run: |
        python etl/main.py
